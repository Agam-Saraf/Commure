# Connection settings only. Schema policy comes from jpa / flyway profiles.
spring.docker.compose.profiles.active=mysql
spring.datasource.url=${MYSQL_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/mydatabase}
spring.datasource.username=${MYSQL_USER:myuser}
spring.datasource.password=${MYSQL_PASSWORD:secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=false
