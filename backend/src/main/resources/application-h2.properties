# Connection settings only. Schema policy comes from jpa / flyway profiles.
spring.datasource.url=${H2_DATASOURCE_URL:jdbc:h2:mem:backend;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${H2_DATASOURCE_USERNAME:sa}
spring.datasource.password=${H2_DATASOURCE_PASSWORD:}
spring.flyway.enabled=false
