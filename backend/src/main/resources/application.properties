spring.application.name=backend
spring.profiles.default=h2
# Infrastructure is managed explicitly by scripts; hello/H2 needs no Docker.
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}
spring.docker.compose.file=../infrastructure/compose.yaml
spring.docker.compose.lifecycle-management=start-only

# Lean defaults — enable via profiles (graphql / docs / metrics / batch / …)
management.endpoints.web.exposure.include=health
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.graphql.graphiql.enabled=false
spring.batch.job.enabled=false
spring.quartz.job-store-type=memory
spring.quartz.auto-startup=true

# Check optional infrastructure only when its feature profile is active.
management.health.mongo.enabled=false
management.health.redis.enabled=false
management.health.rabbit.enabled=false
