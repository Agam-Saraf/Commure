spring.application.name=backend
spring.profiles.default=h2
# Infrastructure is managed explicitly by scripts; hello/H2 needs no Docker.
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}
spring.docker.compose.file=../infrastructure/compose.yaml
spring.docker.compose.lifecycle-management=start-only

# Lean defaults — enable via profiles (graphql / docs / metrics / batch / …)
management.endpoints.web.exposure.include=health
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.graphql.graphiql.enabled=false
spring.batch.job.enabled=false
spring.quartz.job-store-type=memory
spring.quartz.auto-startup=true

# Check optional infrastructure only when its feature profile is active.
management.health.mongo.enabled=false
management.health.redis.enabled=false
management.health.rabbit.enabled=false

# Video transform. BASE_URL / TRANSFORM_SERVICE_TOKEN come from the OS env or the repo-root .env.
transform.base-url=${BASE_URL:}
transform.token=${TRANSFORM_SERVICE_TOKEN:}
video.store.max-entries=20
# Long videos (up to 2 min / 50 MB) are split with ffmpeg into parts the API accepts.
video.max-upload-bytes=50000000
video.max-duration-seconds=120
video.ffmpeg.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
video.ffmpeg.ffprobe-path=${FFPROBE_PATH:ffprobe}
# Above the 50,000,000-byte upload limit so VideoService can return a friendly 413.
spring.servlet.multipart.max-file-size=52MB
spring.servlet.multipart.max-request-size=52MB
# Drain oversized bodies instead of resetting the connection, so clients receive the 413 JSON.
server.tomcat.max-swallow-size=64MB
