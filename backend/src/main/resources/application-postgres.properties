# Connection settings only. Schema policy comes from jpa / flyway profiles.
spring.docker.compose.profiles.active=postgres
spring.datasource.url=${POSTGRES_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/mydatabase}
spring.datasource.username=${POSTGRES_USER:myuser}
spring.datasource.password=${POSTGRES_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=false
